# Recommended follow-up readings, collected from the reference lists of summarised readings
# (and the proposal form). The app shows these as "To read next".
#
# Fields:
#   title, authors, year, venue  as printed in the source that cites it; NOT FOUND IN SOURCE if absent
#   found_in    where it was recommended: a reading citekey, a repo file path, or
#               "external: <where>" for a source outside this repo, with the page
#   why         one line on why it's worth reading for this project
#   priority    high | medium | low
#   status      suggested | saved | skipped
#   key         the Zotero citekey once it's saved (status: saved); empty until then
#   notes       optional
#
# When you save one to Zotero: set status: saved and key: <citekey>. scripts/check.mjs
# warns when a suggested title appears in references.bib, so you don't miss one.


# Runs scripts/check.mjs on every push and pull request.
# On main, it also commits the refreshed README status block and app/public/status.json
# when they changed. The commit message has [skip ci], so it doesn't trigger another run.
name: Check repo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# App saves can push several commits in a row; only the newest run needs to finish.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the checks
        run: node scripts/check.mjs

      - name: Commit the status update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md && git diff --quiet -- app/public/status.json && [ -z "$(git ls-files --others --exclude-standard app/public/status.json)" ]; then
            echo "Status unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app/public/status.json
          git commit -m "chore: update status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
